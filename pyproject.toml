[project]
name = "plant-splat"
version = "0.1.0"
description = "Synthetic data pipeline for plant disease detection using 3D Gaussian splatting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "bitsandbytes>=0.49.0",
    "diffusers>=0.36.0",
    "einops>=0.8.1",
    "gsplat>=1.5.3",
    "numpy>=1.26,<2",
    "opencv-python>=4.6.0.66",
    "peft>=0.18.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.16.3",
    "tensorboard>=2.20.0",
    "timm>=1.0.24",
    "torchvision>=0.24.1",
    "transformers>=4.57.3",
]
